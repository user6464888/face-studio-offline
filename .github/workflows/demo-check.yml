name: Public demo checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-demo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-demo-win-py311.lock.txt
      - run: python -m pip install -r requirements-demo-win-py311.lock.txt
      - run: python main.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
